<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>🍓 Fruit Crush Saga | Match-3 Go365 Day 102</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1e1e32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(100, 150, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #loading .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #6496ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">
            <div class="spinner"></div>
            <div>Загрузка игры...</div>
        </div>
        <canvas id="game"></canvas>
    </div>
    
    <div id="info">
        Go365 Challenge - День 102 | Fruit Crush Saga 🍓<br>
        <small>Match-3 на Go + Ebitengine | Специальные камни, подсказки, частицы</small>
    </div>

    <script>
        // Настройка размера canvas
        const canvas = document.getElementById('game');
        const container = document.getElementById('game-container');
        const loading = document.getElementById('loading');
        
        // Оптимальный размер для мобильных устройств
        const maxWidth = Math.min(450, window.innerWidth - 20);
        const maxHeight = Math.min(800, window.innerHeight - 20);
        const scale = Math.min(maxWidth / 450, maxHeight / 800);

        canvas.width = 450;
        canvas.height = 800;
        canvas.style.width = (450 * scale) + 'px';
        canvas.style.height = (800 * scale) + 'px';
        container.style.width = (450 * scale) + 'px';
        container.style.height = (800 * scale) + 'px';
        
        // Загрузка WASM модуля
        if (!WebAssembly) {
            loading.innerHTML = '<div style="color: #ff5050;">Ваш браузер не поддерживает WebAssembly</div>';
        }
        
        // Go WASM инициализация
        const go = new Go();
        
        fetch('match3.wasm')
            .then(response => response.arrayBuffer())
            .then(bytes => WebAssembly.instantiate(bytes, go.importObject))
            .then(result => {
                loading.style.display = 'none';
                go.run(result.instance);
            })
            .catch(err => {
                loading.innerHTML = '<div style="color: #ff5050;">Ошибка загрузки: ' + err.message + '</div>';
                console.error(err);
            });
    </script>
    
    <!-- Go WASM helper -->
    <script src="wasm_exec.js"></script>
</body>
</html>
