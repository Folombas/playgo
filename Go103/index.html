<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match-3 - Три в ряд</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
        }
        
        canvas {
            display: block;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        #loading .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #34c759;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">
            <div class="spinner"></div>
            Loading game...
        </div>
        <canvas id="game"></canvas>
    </div>
    
    <div class="instructions">
        Click tiles to swap • Match 3+ to score • 60 seconds!
    </div>
    
    <script src="wasm_exec.js"></script>
    <script>
        // Проверяем поддержку WebAssembly
        if (!WebAssembly) {
            document.getElementById('loading').innerHTML = 
                '<p style="color: red;">WebAssembly is not supported in your browser</p>';
            throw new Error('WebAssembly not supported');
        }
        
        // Создаём Go instance
        const go = new Go();
        
        // Загружаем WASM моду
        WebAssembly.instantiateStreaming(
            fetch('game.wasm'),
            go.importObject
        ).then((result) => {
            // Скрываем индикатор загрузки
            document.getElementById('loading').style.display = 'none';
            
            // Запускаем Go программу
            go.run(result.instance);
        }).catch((err) => {
            document.getElementById('loading').innerHTML = 
                `<p style="color: red;">Error loading game: ${err.message}</p>`;
            console.error('Failed to load WASM:', err);
        });
    </script>
</body>
</html>
