<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💎 Crystal Cascade - Match-3 Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #191432;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 800px;
            max-width: 100vw;
            max-height: 100vh;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-align: center;
        }

        #loading .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading Crystal Cascade...</div>
        </div>
        <div id="instructions">
            Click gems to swap • Match 3+ to score • Press R to restart
        </div>
    </div>

    <script>
        // WebAssembly loader
        const canvas = document.getElementById('game-canvas');
        const loading = document.getElementById('loading');

        // Configure canvas size
        canvas.width = 800;
        canvas.height = 800;

        // Load WASM
        if (WebAssembly) {
            fetch('crystal-cascade.wasm')
                .then(response => response.arrayBuffer())
                .then(bytes => WebAssembly.instantiate(bytes, {
                    'env': {
                        'jsStringCopy': function() {},
                        'runtime.ticksPerSecond': 60
                    }
                }))
                .then(results => {
                    loading.style.display = 'none';
                    // Start the game
                    go.run(results.instance);
                })
                .catch(err => {
                    loading.innerHTML = '<div style="color: #ff6464">Error loading game: ' + err.message + '</div>';
                    console.error(err);
                });
        } else {
            loading.innerHTML = '<div style="color: #ff6464">WebAssembly not supported</div>';
        }

        // Touch support for mobile
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (touch.clientX - rect.left) * scaleX;
            const y = (touch.clientY - rect.top) * scaleY;
            
            // Simulate mouse click
            const event = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(event);
        });
    </script>
    
    <!-- Go WASM runtime -->
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
    </script>
</body>
</html>
