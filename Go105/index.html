<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Match Game — Go105</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #141428;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            text-align: center;
        }
        canvas {
            border: 2px solid #6464a0;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(100, 100, 160, 0.3);
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .controls {
            color: #888;
            margin-top: 15px;
            font-size: 14px;
        }
        .controls kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🎮 Geometric Match Game</h1>
        <canvas id="game"></canvas>
        <div class="controls">
            <p><kbd>←</kbd> <kbd>→</kbd> Move &nbsp;|&nbsp; <kbd>↑</kbd> Rotate &nbsp;|&nbsp; <kbd>↓</kbd> Soft Drop</p>
            <p><kbd>Space</kbd> Hard Drop &nbsp;|&nbsp; <kbd>P</kbd> Pause</p>
        </div>
    </div>
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("matchgame.wasm"), go.importObject)
            .then((result) => {
                go.run(result.instance);
            })
            .catch((err) => {
                console.error("Failed to load WASM:", err);
            });
    </script>
</body>
</html>
